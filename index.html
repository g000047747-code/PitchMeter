<style>
:root{--t:#fff;--sub:rgba(255,255,255,.72)}
*{box-sizing:border-box}
body{margin:0;color:var(--t);font-family:-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;padding:26px 16px 80px;background:#07070d;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;animation:hue 45s linear infinite}
.bg i{position:absolute;border-radius:50%}
.bg i:nth-child(1){width:90vmax;height:90vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,#7c4dff 0,transparent 62%);animation:d1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){width:80vmax;height:80vmax;right:-30vmax;top:10vh;background:radial-gradient(circle,#ff4d9d 0,transparent 62%);animation:d2 30s ease-in-out infinite alternate}
.bg i:nth-child(3){width:80vmax;height:80vmax;left:0;bottom:-40vmax;background:radial-gradient(circle,#25c7ff 0,transparent 62%);animation:d3 36s ease-in-out infinite alternate}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes d1{to{transform:translate(35vmax,25vmax) scale(1.2)}}
@keyframes d2{to{transform:translate(-30vmax,15vmax) scale(.85)}}
@keyframes d3{to{transform:translate(30vmax,-25vmax) scale(1.15)}}
@keyframes sh{50%{background-position:100% 50%}}
.w{max-width:760px;margin:auto}
.k{letter-spacing:.35em;font-size:12px;color:var(--sub)}
h1{font-size:30px;margin:8px 0 2px;background:linear-gradient(90deg,#fff,#d4c2ff,#ffc2ec,#a8ecff,#fff);background-size:300% 100%;animation:sh 10s ease infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
.by{color:var(--sub);font-size:14px;margin-bottom:18px}
.c,.b,input[type=text],select,input[type=color]{position:relative;border:0;outline:0;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.refract .c,.refract .b{backdrop-filter:url(#lg) blur(14px) saturate(180%)}
.c{border-radius:30px;padding:18px;margin:16px 0;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05))}
.b{display:block;width:100%;border-radius:22px;padding:16px;font-size:17px;font-weight:700;color:#fff;text-align:center;cursor:pointer;transition:transform .15s}
.b:active{transform:scale(.97)}
.b.p{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),linear-gradient(120deg,rgba(150,110,255,.5),rgba(255,110,180,.45),rgba(60,200,255,.45));background-size:100% 100%,240% 240%;animation:sh 8s ease infinite}
.b:disabled{opacity:.4}
canvas{display:block;margin:auto;max-width:100%;max-height:58vh;border-radius:22px;background:#000;touch-action:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input[type=range]{width:100%;accent-color:#d8c7ff}
input[type=text],select{width:100%;padding:11px 12px;border-radius:14px;color:#fff;font-size:16px}
select option{color:#000}
input[type=color]{width:100%;height:40px;border-radius:12px;padding:3px}
.r{display:flex;gap:10px}.r>*{flex:1}
.s{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.ck{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t);margin:4px 0}.ck input{width:auto}
h3{margin:22px 0 0;font-size:16px}
#bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-top:10px}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b57bee,#f47fb8)}
#bar.ind i{width:40%!important;animation:ind 1s ease-in-out infinite alternate}@keyframes ind{to{margin-left:60%}}
a.dl{color:#ffd1f0;font-weight:700}
</style>
</head>

   $('es').textContent='書き出し中… '+Math.round(v.currentTime/v.duration*100)+'%（このタブを開いたままに）';
   if(v.paused)v.play().catch(()=>{});
   if(Math.abs(v.currentTime-lt)<.01){if(++stall>=20)stop()}else stall=0;
   lt=v.currentTime},500);
 }catch(e){
  if(rec&&rec.state!=='inactive')stop();else{cleanup();$('es').textContent='書き出しを開始できませんでした：'+e.message}
 }
};
</script>
</body>
